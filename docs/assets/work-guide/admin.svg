<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#f1f5f9"/><rect x="28" y="25" width="1144" height="66" rx="16" fill="#0f172a"/><text x="58" y="67" fill="#fff" font-family="Arial" font-size="26" font-weight="700">BEEZONE | GIAO VIỆC &amp; BÀN GIAO - HÀNH CHÍNH</text><g font-family="Arial"><rect x="30" y="115" width="352" height="370" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="3"/><rect x="424" y="115" width="352" height="370" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/><rect x="818" y="115" width="352" height="370" rx="18" fill="#fff" stroke="#10b981" stroke-width="3"/><text x="56" y="158" font-size="25" font-weight="700" fill="#92400e">1. HÀNH CHÍNH</text><text x="450" y="158" font-size="25" font-weight="700" fill="#1d4ed8">2. BÀN GIAO</text><text x="844" y="158" font-size="25" font-weight="700" fill="#047857">3. VIỆC GIÁO VIÊN</text><g fill="#334155" font-size="19"><text x="56" y="205">• Tạo và phân công việc</text><text x="56" y="242">• Chọn người, ngày, ưu tiên</text><text x="56" y="279">• Theo dõi trạng thái</text><text x="56" y="316">• Xem toàn trung tâm</text><text x="450" y="205">• Chuyển việc còn dở</text><text x="450" y="242">• Ghi người nhận và lý do</text><text x="450" y="279">• Người nhận xác nhận</text><text x="450" y="316">• Theo dõi lịch sử bàn giao</text><text x="844" y="205">• Theo dõi lớp và ca dạy</text><text x="844" y="242">• Biết nghỉ / giáo viên thay</text><text x="844" y="279">• Xem tiến độ chuyên môn</text><text x="844" y="316">• Không hiện cột hành chính</text></g><rect x="57" y="367" width="294" height="70" rx="12" fill="#fffbeb"/><text x="78" y="397" font-size="17" fill="#92400e">Quyền dựa trên vai trò được cấp</text><text x="78" y="422" font-size="17" fill="#92400e">trong hồ sơ nhân viên.</text></g></svg>
